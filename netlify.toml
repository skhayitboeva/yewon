[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # MONGODB_DB is just a database name, not a credential — but its value
  # ("yewon") is also a substring of this project's own name, so it shows up
  # throughout the docs/README and trips Netlify's secrets scanner as a false
  # positive. The real credential-bearing vars (MONGODB_URI, JWT_SECRET,
  # APP_PASSWORD_HASH_*, TELEGRAM_BOT_TOKEN) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "MONGODB_DB"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# SPA fallback — must come after the function paths, which Netlify Functions v2
# registers itself via each function's `config.path`.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
